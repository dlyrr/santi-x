[package]
name = "santi-sharex"
version = "0.1.0"
description = "Screen capture for Windows, rebuilt"
authors = ["santi"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "santi_sharex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xcap = "0.9.7"
image = "0.25.10"
chrono = { version = "0.4.45", features = ["serde"] }
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-clipboard-manager = "2.3.2"
base64 = "0.22"
# M2.6 §1: the WH_KEYBOARD_LL fallback in `hotkeys.rs`. 0.61 is what the Tauri
# dependency tree already resolves to, so this adds no second copy of the
# Windows metadata crates. santi.sharex is a Windows-only app, so this is an
# unconditional dependency rather than a `cfg(windows)` one.
#
# The DataExchange/Memory/Gdi features are M2.7 §1: the native clipboard
# fallback in `clipboard.rs`. Gdi is there only for `BITMAPV5HEADER`;
# `Win32_System_Ole` is deliberately *not* enabled — it exists here only to
# define `CF_DIBV5` as a `u16`, and pulls the whole COM surface in to do it.
#
# Registry is the rename migration in `migrate.rs`: the stale `Run` value the
# old "Nimbus" autostart registration left behind is read and deleted through
# the API rather than by shelling out to `reg.exe`.
#
# `Win32_Security_Credentials` is M3 §2: `upload/secrets.rs` keeps FTP passwords
# and API keys in Windows Credential Manager rather than in `settings.json`, and
# `CredWriteW`/`CredReadW`/`CredDeleteW`/`CredFree` live behind that feature.
#
# The WinRT namespaces at the bottom are M5 §3, the offline OCR in `ocr.rs`.
# `Globalization` is not on that milestone's list but is unavoidable:
# `TryCreateFromLanguage` takes a `Windows.Globalization.Language` and
# `RecognizerLanguage` hands one back. `Win32_System_Com` is there for
# `CoIncrementMTAUsage` alone — WinRT activation from a `spawn_blocking` pool
# thread needs an apartment, and that is the one way to get one without
# initialising (and then having to un-initialise) a thread we do not own.
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security_Credentials",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
] }
tauri-plugin-autostart = "2.5.1"
# M3 §6. `default-features = false` is load-bearing, not tidiness: reqwest's
# default TLS backend is native-tls, which on Windows is a Schannel/OpenSSL build
# this machine has no C toolchain for. `rustls-tls` resolves to webpki-roots plus
# ring, both of which build here — verified, not assumed.
#
# `blocking` because `Destination::upload` is a synchronous trait method and every
# upload already runs on a `spawn_blocking` worker (M3 §6, "off the UI thread");
# reqwest's blocking client owns its own runtime thread, so it is safe to call
# from one. `multipart` is the body Imgur and `.sxcu` MultipartFormData both need.
# No `json` feature: `serde_json` is already a dependency and responses are parsed
# from text, which is also what `$json:…$` templating needs to see.
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "multipart",
  "rustls-tls",
] }
# M3 §5. `rustls-ring`, never `native-tls` (OpenSSL) or `rustls-aws-lc-rs`
# (CMake). Same constraint as above, and the reason SFTP is not implemented at
# all: an SSH stack means libssh2, which means C.
suppaftp = { version = "10", default-features = false, features = ["rustls-ring"] }
# The root certificates FTPS verifies against. reqwest already pulls exactly this
# crate in behind `rustls-tls`, so naming it here costs nothing to build and means
# HTTPS and FTPS trust the same set — an FTPS server whose certificate santi.sharex
# rejects would be rejected by a browser too, which is the only defensible answer
# when there is no "trust this one anyway" escape hatch (and there is not).
webpki-roots = "1"
